schema: 1
suite_id: BEHAVIOR-QUOTIENT-RL
work_dir: ./work/behavior_quotient

source:
  input_globs:
    - ./work/causal_query_audit/results/full/states/*/*.json
    - ./work/causal_query_audit/results/pilot/states/*/*.json

reward:
  support: 1.0
  answer_f1: 0.5
  immediate_gain: 0.25
  search_cost: 0.02
  protocol_cost: 1.0

model:
  base_model: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28

retrieval:
  bm25_url: http://127.0.0.1:8101/retrieve
  e5_url: http://127.0.0.1:8102/retrieve
  topk: 3

fixed_budget:
  budgets: [2, 3, 4]

signature_audit:
  modes:
    - unordered-set
    - top1
    - top3-ranked
    - title-token-jaccard-050
    - title-token-jaccard-075
    - title-token-jaccard-090

training:
  experiment_id: EXP-027
  n_agent: 8
  update_per_prompt: 4
  train_gpus: "0,1,2,3,4,5,6"
  n_gpus: 7
  e5_gpu: 7
  topk: 3
  max_turns: 4
  max_prompt_length: 4096
  max_response_length: 500
  max_start_length: 2048
  max_obs_length: 500
  learning_rate: 1.0e-6
  rollout_gpu_memory: 0.55
  variants:
    standard:
      advantage_mode: surface
      selection_mode: all
      update_per_prompt: 0
    random-surface:
      advantage_mode: surface
      selection_mode: surface-random
      update_per_prompt: 4
    balanced-surface:
      advantage_mode: surface
      selection_mode: behavior-balanced
      update_per_prompt: 4
    random-quotient:
      advantage_mode: quotient
      selection_mode: surface-random
      update_per_prompt: 4
    balanced-quotient:
      advantage_mode: quotient
      selection_mode: behavior-balanced
      update_per_prompt: 4

profiles:
  smoke:
    offline_states: 24
    signature_states: 24
    selection_draws: 50
    bootstrap_samples: 200
    seeds: [13]
    total_updates: 10
    train_batch: 14
    val_batch: 14
    mini_batch: 14
    micro_batch: 7
    save_freq: 10
    test_freq: 10
    eval_limit: 20
  pilot:
    offline_states: 300
    signature_states: 300
    selection_draws: 500
    bootstrap_samples: 5000
    seeds: [13, 42, 87]
    total_updates: 100
    train_batch: 56
    val_batch: 56
    mini_batch: 56
    micro_batch: 7
    save_freq: 100
    test_freq: 50
    eval_limit: 500
  full:
    offline_states: 600
    signature_states: 600
    selection_draws: 2000
    bootstrap_samples: 10000
    seeds: [13, 42, 87, 101, 202]
    total_updates: 300
    train_batch: 56
    val_batch: 56
    mini_batch: 56
    micro_batch: 7
    save_freq: 100
    test_freq: 100
    eval_limit: 1000

gates:
  EXP-024:
    minimum_alias_growth: 0.02
    minimum_behavior_count_decline: 0.10
  EXP-025:
    minimum_coverage_gain: 0.10
    minimum_union_recall_gain: 0.02
  EXP-026:
    minimum_precision: 0.95
    minimum_recall: 0.80
    minimum_best_class_hit: 0.95
  EXP-027:
    minimum_behavior_coverage_gain: 0.10
    minimum_evidence_gain: 0.02
    maximum_answer_f1_regression: 0.01
  EXP-028:
    minimum_seen_or_cross_support_gain: 0.02
    minimum_hybrid_support_gain: 0.01
    maximum_answer_f1_regression: 0.01
    maximum_search_call_increase: 0.0
    maximum_protocol_failure_increase: 0.0
