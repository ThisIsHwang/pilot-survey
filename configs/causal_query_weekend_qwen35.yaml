schema: 1
work_dir: ./work/causal_query_audit

model:
  base_model: Qwen/Qwen3.5-9B
  revision: 28a1d5547fecc4172665ca0ee26ea6c6dc8d3127
  served_model_name: Qwen/Qwen3.5-9B
  trust_remote_code: true
  minimum_parameters: 8000000000
  maximum_parameters: 11000000000
  api_base: http://127.0.0.1:9000/v1
  api_key: EMPTY
  enable_thinking: false
  require_non_thinking: true
  chat_template_kwargs:
    enable_thinking: false
  sampling:
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
  deterministic_sampling:
    top_p: 1.0
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

source:
  input_globs:
    - ./work/hard_rq0/runs/*/results/policies/*.jsonl
    - ./work/experiments/EXP-002/results/**/*.jsonl
    - ./work/experiments/EXP-008/results/**/*.jsonl
  datasets: [2wikimultihopqa, musique, hotpotqa]
  policy_tags: []
  topks: [3]
  intervention_turns: [2, 3]
  require_protocol_success: true
  one_state_per_question_backend: true
  maximum_prefix_support_recall: 0.5

retrieval:
  bm25_port: 8101
  e5_port: 8102
  e5_gpu: 7

agent:
  max_search_turns: 4
  observation_token_budget: 500
  answer_weight: 0.25
  search_cost: 0.01

alternatives:
  styles: [lexical, semantic, entity]
  temperature: 0.7
  max_tokens: 256
  attempts: 3
  minimum_tokens: 2
  length_ratio_low: 0.45
  length_ratio_high: 1.8

continuation:
  # Qwen's recommended non-thinking sampling is used with common random seeds.
  temperature: 0.7
  max_tokens: 512
  request_timeout: 240
  request_retries: 4

validation:
  recall_tolerance: 1.0e-8
  minimum_prefix_title_jaccard: 0.95
  minimum_factual_title_jaccard: 0.95

analysis:
  epsilon: 1.0e-8
  bridge_min_support_tqe: 0.05
  top_examples: 12

profiles:
  smoke:
    states_per_backend: 6
    alternatives_per_state: 2
    workers: 4
    bootstrap_samples: 200
  pilot:
    states_per_backend: 120
    alternatives_per_state: 3
    workers: 28
    bootstrap_samples: 5000
  full:
    states_per_backend: 300
    alternatives_per_state: 3
    workers: 48
    bootstrap_samples: 20000

gate:
  maximum_direct_total_spearman: 0.40
  minimum_bridge_rate_among_zero_direct: 0.15
  minimum_redundant_direct_rate: 0.05
  minimum_bridge_downstream_effect: 0.02
  require_bridge_examples_in_both_backends: true
